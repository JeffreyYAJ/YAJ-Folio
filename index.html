<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeffrey YAJ - Portfolio</title>
    <meta name="description" content="Portfolio développeur futuriste avec animations 3D immersives et technologies de pointe" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #000000;
        overflow-x: hidden;
        cursor: none;
      }
      
      /* Custom Cursor */
      .custom-cursor {
        position: fixed;
        width: 20px;
        height: 20px;
        background: radial-gradient(circle, rgba(0, 212, 255, 0.8), rgba(139, 92, 246, 0.4));
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: difference;
        transition: transform 0.1s ease;
      }
      
      /* Loading Animation */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        animation: fadeOut 2s ease-in-out 3s forwards;
      }
      
      .loading-cube {
        width: 60px;
        height: 60px;
        background: linear-gradient(45deg, #00d4ff, #8b5cf6);
        animation: loadingCube 2s ease-in-out infinite;
      }
      
      @keyframes loadingCube {
        0%, 100% {
          transform: rotateX(0deg) rotateY(0deg);
        }
        50% {
          transform: rotateX(180deg) rotateY(180deg);
        }
      }
      
      @keyframes fadeOut {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div class="loading-screen">
      <div class="loading-cube"></div>
    </div>
    
    <!-- Custom Cursor -->
    <div class="custom-cursor" id="cursor"></div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Custom Cursor
      const cursor = document.getElementById('cursor');
      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX - 10 + 'px';
        cursor.style.top = e.clientY - 10 + 'px';
      });
      
      // Cursor hover effects
      document.addEventListener('mouseenter', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') {
          cursor.style.transform = 'scale(2)';
        }
      });
      
      document.addEventListener('mouseleave', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') {
          cursor.style.transform = 'scale(1)';
        }
      });
    </script>
  </body>
</html>
